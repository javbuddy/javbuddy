name: Test results

# Publishes the TRX files uploaded by CI. Runs from workflow_run so it has a write token even for
# fork PRs, without executing any code from the PR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          check_name: Unit test results
          comment_title: Unit test results
          files: artifacts/test-results-unit/*.trx

      - name: E2E test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          check_name: E2E test results
          comment_title: E2E test results
          files: artifacts/test-results-e2e/*.trx
