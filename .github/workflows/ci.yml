name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet format Javbuddy.slnx --verify-no-changes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig
      - run: dotnet test Javbuddy.Tests/Javbuddy.Tests.csproj --logger "trx;LogFileName=unit.trx" --results-directory TestResults/unit
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: TestResults/unit/*.trx
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig
      - run: dotnet build Javbuddy.E2ETests/Javbuddy.E2ETests.csproj
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - run: pwsh Javbuddy.E2ETests/bin/Debug/net11.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test Javbuddy.E2ETests/Javbuddy.E2ETests.csproj --no-build --logger "trx;LogFileName=e2e.trx" --results-directory TestResults/e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: TestResults/e2e/*.trx
          if-no-files-found: ignore

  # Test results are published by test-results.yml (workflow_run), which works for fork PRs; it
  # needs this PR event payload to know which PR the results belong to.
  event-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  # Each platform builds natively on its own runner (compiling ffmpeg under QEMU emulation would be
  # far too slow) and pushes by digest; docker-merge then stitches the digests into one multi-arch tag.
  docker-build:
    needs: [format, test, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'linux/amd64'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/javbuddy/javbuddy
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && 'type=image,name=ghcr.io/javbuddy/javbuddy,push-by-digest=true,name-canonical=true,push=true' || '' }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    if: github.event_name != 'pull_request'
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main pushes -> :latest; published releases (tag vX.Y.Z) -> :X.Y.Z, :X.Y, :X
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/javbuddy/javbuddy
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/javbuddy/javbuddy@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/javbuddy/javbuddy:${{ steps.meta.outputs.version }}
