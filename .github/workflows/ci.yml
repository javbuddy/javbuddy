name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: dotnet format Javbuddy.slnx --verify-no-changes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig
      - run: dotnet test Javbuddy.Tests/Javbuddy.Tests.csproj

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig
      - run: dotnet build Javbuddy.E2ETests/Javbuddy.E2ETests.csproj
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
      - run: pwsh Javbuddy.E2ETests/bin/Debug/net11.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test Javbuddy.E2ETests/Javbuddy.E2ETests.csproj --no-build

  docker:
    needs: [format, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/javbuddy/javbuddy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
